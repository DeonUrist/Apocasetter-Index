name: Mod submission

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: index-write
  cancel-in-progress: false

jobs:
  check:
    # every new or edited "Submit a mod" issue gets an automatic check comment
    if: >-
      github.event.action != 'labeled' &&
      (startsWith(github.event.issue.title, '[Submit]') || contains(github.event.issue.labels.*.name, 'submission'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/submission.py check

  approve:
    # only the repository owner's 'approved' label lists a mod
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'approved' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: entry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/submission.py approve
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py
      - name: Commit
        env:
          GUID: ${{ steps.entry.outputs.guid }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git add mods index.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add $GUID (#$NUM)"
          git pull --rebase
          git push
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/submission.py close
