name: Mod submission

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: index-write
  cancel-in-progress: false

jobs:
  check:
    # every new or edited "Submit a mod" issue gets an automatic check comment
    if: >-
      github.event.action != 'labeled' &&
      (startsWith(github.event.issue.title, '[Submit]') || contains(github.event.issue.labels.*.name, 'submission'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/submission.py check

  approve:
    # only the repository owner's 'approved' label lists a mod
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'approved' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: entry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/submission.py approve
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py
      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUID: ${{ steps.entry.outputs.guid }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git add mods index.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add $GUID (#$NUM)"
          # keep the new mods/ entry; index.json is generated, so rebuild it on top of main if main moved
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git checkout --theirs index.json 2>/dev/null; git add index.json; GIT_EDITOR=true git rebase --continue; }
            python3 scripts/build_index.py
            git add index.json
            git diff --cached --quiet || git commit --amend --no-edit
          done
          exit 1
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/submission.py close
